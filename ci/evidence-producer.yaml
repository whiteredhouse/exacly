# Exacly's producer proposal. Review it at the approved revision before generating a policy.
# The library supplies no branch, workflow, job, artifact or observer-path defaults.
producer:
  branch: main
  workflow:
    path: .github/workflows/verification-evidence.yml
    job_id: observe
    job_name: Observe verification
    steps:
      verification: Run verification
      package: Package verification evidence
      upload: Upload verification evidence
  artifact:
    name_prefix: exacly-evidence

# Literal repository-relative file or directory selectors, never glob patterns.
# Missing selectors pin absence; adding them later changes the observer fingerprint.
# This workflow runs the checkout's installed CLI. Pin its complete source package,
# including entrypoint imports and future modules, rather than only the packager.
# Source-package changes therefore require review and regeneration of this policy.
observer_paths:
  - .github/workflows/verification-evidence.yml
  - ci/evidence-producer.yaml
  # Verification still exercises the legacy entrypoint for compatibility.
  - ci/package_verification_evidence.py
  - python/src/exacly
  - pyproject.toml
  - uv.lock
  - mise.toml
  - python/tests
  - spec/tests
  - tests
  - conftest.py
  - python/conftest.py
  - spec/conftest.py
  - ci/conftest.py
