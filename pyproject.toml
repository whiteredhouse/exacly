[project]
name = "exacly"
version = "0.2.0"
description = "Validate, refresh and ask Exacly models (0.1 product maps, 0.2 config and state), for people and coding agents"
readme = "python/README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6",
]

[project.scripts]
exacly = "exacly.cli:exacly_main"
# The commands' names before 0.2.0, kept for one release.
exacly-validate = "exacly.cli:validate_renamed"
exacly-refresh = "exacly.cli:refresh_renamed"

[dependency-groups]
dev = [
    "jsonpatch",
    "mypy",
    "pytest>=9.1.1",
    "ruff",
    "types-jsonschema",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["python/src", "python/README.md", "spec/schema"]

[tool.hatch.build.targets.wheel]
packages = ["python/src/exacly"]

# The wheel carries the spec's schemas, so the installed command validates without the repository.
[tool.hatch.build.targets.wheel.force-include]
"spec/schema" = "exacly/schemas"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["python/src", "python/tests", "spec/tests", "tests"]
strict = true

# jsonpatch ships no type information; only the tests use it.
[[tool.mypy.overrides]]
module = ["jsonpatch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# xunit1 keeps each test's file in the JUnit report, which exacly refresh reads.
junit_family = "xunit1"
