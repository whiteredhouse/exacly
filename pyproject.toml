[project]
name = "exacly"
version = "0.7.0rc1"
description = "Validate, refresh and ask Exacly models (0.1 product maps, 0.2 config and state), for people and coding agents"
# The README comes from python/README.md, with its links into the repository made absolute for PyPI.
dynamic = ["readme"]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["architecture", "traceability", "requirements", "product-model", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/whiteredhouse/exacly"
Documentation = "https://github.com/whiteredhouse/exacly/blob/main/python/README.md"
Specification = "https://github.com/whiteredhouse/exacly/blob/main/spec/README.md"
Issues = "https://github.com/whiteredhouse/exacly/issues"

[project.scripts]
exacly = "exacly.cli:exacly_main"
# The commands' names before 0.2.0, kept for one release.
exacly-validate = "exacly.cli:validate_renamed"
exacly-refresh = "exacly.cli:refresh_renamed"

[dependency-groups]
dev = [
    "jsonpatch",
    "mypy",
    "pytest>=9.1.1",
    "ruff",
    "types-jsonschema",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["python/src", "python/README.md", "spec/schema", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["python/src/exacly"]

# The wheel carries the spec's schemas, so the installed command validates without the repository.
[tool.hatch.build.targets.wheel.force-include]
"spec/schema" = "exacly/schemas"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "python/README.md"

# Relative links such as ../spec/README.md only resolve on GitHub.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(\.\./([^)]*)\)'
replacement = '](https://github.com/whiteredhouse/exacly/blob/main/\1)'

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["python/src", "python/tests", "spec/tests", "tests", "ci", "verification"]
strict = true

# jsonpatch ships no type information; only the tests use it.
[[tool.mypy.overrides]]
module = ["jsonpatch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Exercise repository-owned CI adapters through the same imports as their runtime CLI.
pythonpath = ["."]
# xunit1 keeps each test's file in the JUnit report, which exacly refresh reads.
junit_family = "xunit1"
