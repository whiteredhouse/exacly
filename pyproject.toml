[project]
name = "exacly-validate"
version = "0.1.0"
description = "Validate Exacly product maps against the Exacly Specification"
readme = "validator/README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6",
]

[project.scripts]
exacly-validate = "exacly_validate.cli:main"

[dependency-groups]
dev = [
    "jsonpatch",
    "mypy",
    "ruff",
    "types-jsonschema",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["validator/src", "validator/README.md", "spec/schema"]

[tool.hatch.build.targets.wheel]
packages = ["validator/src/exacly_validate"]

# The wheel carries the spec's schemas, so the installed command validates without the repository.
[tool.hatch.build.targets.wheel.force-include]
"spec/schema" = "exacly_validate/schemas"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["prototypes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["validator/src", "validator/tests", "spec/tests"]
strict = true

# jsonpatch ships no type information; only the tests use it.
[[tool.mypy.overrides]]
module = ["jsonpatch"]
ignore_missing_imports = true
