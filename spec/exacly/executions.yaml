# Exacly's own model: operator-controlled bindings for existing pending verification work.
# Registration writes the execution ledger, never observations or pending state.
exacly: "0.2.0"

records:
  - id: REQ-021
    type: Requirement
    name: Register immutable execution bindings for pending work
    description: Record explicit operator intent linking existing pending verification work to a reviewed goal and output target.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-28"
    statement: >-
      Given a reviewed plan action, existing pending task and state, readiness and producer trust policies,
      output target and registration date, register an immutable binding in an explicitly selected private
      execution ledger, preserving supersession history and state watermarks without dispatching work,
      changing source state or claiming verification or task completion.
    acceptance_criteria:
      - Registration is an explicit offline operator action with no GitHub token requirement; it validates the selected plan action, policies, target and existing pending entry without authenticating live evidence.
      - A binding captures namespace, context, lineage, canonical Requirement ID, task identifier, UTC opening time, complete pending-entry digest and dimension, selected plan and action, goal and policy identities, output target, historical state serial, config revision and digest, registration timestamp and evaluation date.
      - The evaluation date cannot precede the plan or the state's UTC writing date; the pending task's opening timestamp is normalized to UTC and cannot follow that state snapshot.
      - Verification pending work can be registered directly; a missing dimension requires explicit adopt-verification consent without modifying state, and other dimensions are rejected.
      - The ledger is an explicitly selected SQLite file outside Git working trees, model folders and input paths, in a pre-existing operator-owned POSIX 0700 directory with file mode 0600; no repository discovery or JSON binding import grants authority.
      - The operator's controlled runtime and directory provide the storage authority boundary; permissions do not isolate candidate code running as the same operating-system user.
      - Newly initialized registration stores use schema version 1; existing supported version-1 and version-2 stores retain their format, and registration never performs an implicit schema upgrade.
      - Before completion, repeating the same pending identity and contract is idempotent and retains the original record's evaluation date, registration timestamp and historical snapshot; a different active contract conflicts unless supersedes names the exact current binding for that pending key.
      - Explicit supersession atomically appends an immutable replacement, preserves the prior record as inactive history and rejects a concurrent change to the active binding.
      - An unresolved prepared completion intent blocks registration and supersession for that pending identity, and a completed pending identity cannot be registered or reused; aborted completion intents remain historical records and permit a fresh attempt.
      - The store remembers the latest registered state serial and digest by pending identity, rejects rollback and same-serial divergence, and permits later refreshed state preserving the same pending entry; a newer registration can advance the watermark without rewriting the immutable record.
      - Watermarks guard registered history for the bound pending item without authenticating global state freshness or proving the supplied file is the latest filesystem snapshot.
      - Show and bound-preview reads require an existing valid store, refuse unknown schemas and existing journal or WAL sidecars, and neither initialize, migrate, recover nor modify its schema, records or watermarks.
      - Validation reuse is confined to one unchanged protected database view; a new operation or a changed view requires full schema, binding and retained-proof validation, including unrelated and aborted completion history, before further reuse.
      - Registration and show accept a finite nonnegative lock timeout defaulting to 30 seconds; one monotonic budget bounds directory and SQLite waits, with zero allowing an immediate attempt and actionable nonmutating errors on timeout.
      - The lock-wait budget does not limit the whole operation's computation or external HTTP requests, and expiration never permits implicit recovery or bypassing storage checks.
      - Registration changes only the ledger; it never changes input files, observations, pending work or external tasks and never dispatches agents or claims an executor-output link or task closure.
    verification_method: Execution contract, storage and command tests in CI.
    observe:
      tests:
        cases:
          - "python/tests/test_executions.py::*"
          - "python/tests/test_execution_store.py::*"
          - "python/tests/test_executions_cli.py::*"
          - "python/tests/test_completion_validation.py::*"
          - "python/tests/test_completion_journal.py::*"

  - id: APP-010
    type: Application
    name: Execution binding registry
    description: The explicit execution registration and inspection commands with their SQLite store.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-28"
    responsibility: Register reviewed pending-task contracts and preserve their immutable history and state watermarks.
    interfaces: [exacly executions register command, exacly executions show command, exacly.executions Python API]
    implementation_ref: { locator: python/src/exacly/executions.py }

  - id: INFO-003
    type: Information
    name: Execution bindings
    description: Immutable operator registrations connecting pending verification work to reviewed plans and output targets.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-28"
    definition: Versioned execution binding records with active supersession history and registered-state watermarks.
    identifiers: [binding ID, namespace, context, lineage, canonical record ID, task identifier, UTC opening time]
    steward: exacly-maintainers

  - id: INF-003
    type: Infrastructure
    name: Private execution ledger
    description: An operator-selected SQLite database in a protected directory outside Git working trees and model folders, with explicit schema selection for completion storage.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-28"
    kind: Local SQLite storage
    purpose: Retain immutable execution bindings, supersession history and registered-state watermarks, plus admitted completion proof, intents and receipts in explicitly upgraded version-2 stores, under operator control.
    operational_ref: { locator: "Operator-selected protected SQLite file supplied through --ledger." }

