  - id: INFO-006
    type: Information
    name: Historical integrity baselines and semantic verdicts
    description: Proposed required exact-byte associations with separately reusable terminal semantic results tied to the installed validation profile.
    owner: exacly-maintainers
    lifecycle: proposed
    evidence: []
    last_reviewed_at: "2026-10-28"
    definition: Versioned exact-row-set integrity baselines with domain-separated typed input digests and dependency associations, plus separately profile-scoped successful terminal verdicts or explicit invalidation state; all proof remains in the same ledger and neither record independently grants approval or authenticates historical origin.
