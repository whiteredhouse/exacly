# Exacly's own model: compose independently authorized live admissions and readiness decisions.
# Config, authored by people and agents; retained aggregate reports do not publish model state.
exacly: "0.2.0"

records:
  - id: REQ-032
    type: Requirement
    name: Compose required evidence admissions and readiness gates
    description: Evaluate every member of an approved composition through its own native admission and readiness contract.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    statement: >-
      Given an independently reviewed required-member definition, exact per-invocation run selections
      and evaluation date, validate the whole composition before retrieving evidence, freshly admit
      and evaluate each member under its own policies and approved model, and retain a complete
      aggregate decision that succeeds only when every required member is admitted and ready.
    acceptance_criteria:
      - A closed versioned definition declares a bounded nonempty set of unique safe member IDs, each member's trust policy, readiness policy and explicit approved-model root, and explicitly scoped consistency groups; a separate versioned selection must identify exactly the required member set with immutable run, attempt and source target selections.
      - The definition digest binds the definition and resolved trust policies, readiness policies and approved named model content; each invocation pins that digest, so omitted or duplicate members, unknown references, producer substitution, weakened policies and changed model inputs cannot silently alter the reviewed composition.
      - Supported pure Python validation interfaces validate every member's request, conforming config-only model and policy references before source access; the model's canonical files and content digest must match its independently approved trust policy, and source targets retain the native context, full model revision and full implementation revision contract.
      - Consistency rules apply only to explicitly listed member groups; implementation equality includes repository identity, while model equality includes repository, namespace, approved revision, selected files and config digest; ungrouped repositories need not share revisions or model namespaces.
      - Evaluation reuses the native admission and readiness evaluators for each member, preserving its original model namespace, target, assessments and evidence identities; it neither unions foreign state nor relabels context to obtain a positive result.
      - Admission acceptance and readiness remain separate outcomes; a completed failing report may be admitted, while failed, skipped, incomplete, missing, inapplicable, unavailable or rejected evidence prevents aggregate success.
      - Every invocation performs fresh admission for every selected required member; retained successful partial results remain diagnostic and never substitute for a new invocation's live checks.
      - Each CLI invocation retains per-member receipts, admitted evidence and fresh state when available, readiness results and exact immutable selections in a new protected output directory; POSIX directories use mode 0700 and files use 0600 independently of umask, and input aliases and existing output paths are refused.
      - Machine-readable output distinguishes incomplete retained work from a final complete aggregate; interrupted, missing or partially written output cannot represent all-members success, and a satisfied final aggregate is published atomically only after all required member outputs are retained.
      - Offline definition validation reports the content digest for independent review without approving the definition; complete satisfied evaluation exits 0, a complete blocked aggregate exits 1, and invalid inputs or required-output errors exit 2 with actionable diagnostics.
      - Installed-wheel tests exercise the public composition commands outside the source checkout; acceptance coverage includes four required members, omission, duplication, substituted producers, scoped identity mismatches, failed and skipped observations, partial failure, fresh reruns and compatibility of single-target commands.
      - Required platform and external release inventories, producer selection and policy approval remain consumer responsibilities; reports are unsigned, preserve existing admission claims and establish neither test honesty, acceptance coverage, executor provenance, completion authority nor deployment authorization.
    verification_method: Native composition, command, retention and installed-wheel acceptance tests, together with unchanged single-target admission and readiness tests.
    observe:
      tests:
        cases:
          - "python/tests/test_composition.py::*"
          - "python/tests/test_composition_cli.py::*"
          - "tests/test_composition_distribution.py::*"

  - id: APP-018
    type: Application
    name: Evidence admission composition
    description: Sequential composition validation and evaluation commands sharing the native admission and readiness cores.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    responsibility: Validate and preserve the approved required-member contract, freshly evaluate every selected member independently, and retain an explainable aggregate without granting broader authority.
    interfaces: [exacly composition validate command, exacly compose github-actions command, exacly.composition Python API]
    implementation_ref: { locator: python/src/exacly/composition.py }

  - id: INFO-009
    type: Information
    name: Composition decisions and retained member evidence
    description: Per-invocation approved composition identity, exact member selections and individual and aggregate admission/readiness decisions.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    definition: A versioned aggregate report with completeness and result, definition and policy identities, each required member's immutable target and run attempt, native admission receipt and retained proof, readiness outcome and partial-failure diagnostics in a new private bundle.
    identifiers: [definition digest, member ID, policy digest, model identity, target identity, GitHub run and attempt, evidence digest]
    steward: exacly-maintainers

  - id: INF-006
    type: Infrastructure
    name: Private composition bundle
    description: Explicit new local output directory retaining one composition invocation and its member evidence.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    kind: Private local POSIX report and evidence directory
    purpose: Retain independently evaluated member bundles and a final aggregate while preserving incomplete diagnostics without overwriting prior invocations or publishing authoritative model state.
    operational_ref: { locator: docs/admission-composition.md }

relationships:
  - { source: REQ-032, type: supports, target: PROC-002 }
  - { source: APP-018, type: implements, target: REQ-032 }
  - { source: PROC-002, type: uses, target: APP-018, conditions: Explicitly composes independently required admission and readiness decisions while authoritative state publication remains separate. }
  - { source: APP-018, type: depends_on, target: APP-008, conditions: Every member requires fresh native live evidence admission under its own approved trust policy. }
  - { source: APP-018, type: depends_on, target: APP-006, conditions: Every member separately evaluates the approved readiness policy against its freshly admitted state and explicit target. }
  - { source: APP-018, type: depends_on, target: INF-006, conditions: Each invocation selects a new protected output destination; partial results cannot replace fresh admission. }
  - { source: APP-018, type: reads, target: INFO-001 }
  - { source: APP-018, type: reads, target: INFO-002 }
  - { source: APP-018, type: writes, target: INFO-009 }
  - { source: INF-006, type: stores, target: INFO-009, role: system_of_record, conditions: Retains the per-member proof and complete or explicitly incomplete aggregate for one invocation. }
