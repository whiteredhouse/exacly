# Exacly's own model: understanding a model, for the people and agents who change the product.
# Config: records, relationships and bindings, authored by people and agents (section 9).
exacly: "0.2.0"

records:
  - id: CAP-003
    type: Capability
    name: Understand a model
    description: Answer questions about a model from its config and state, for people and agents alike.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-24"
    scope: >-
      Reading a model: what a record is, why it exists, what realizes it, what a change affects and what is
      missing. Excludes changing config or state.

  - id: PROC-003
    type: Process
    name: Look into a record before changing it
    description: How a person or an agent learns what a change touches before making it, and checks it after.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-24"
    perspective: business
    actors: [Developer, Coding agent]
    trigger: A task names a record, or a change touches code that a record points at
    steps:
      - Show the record, with its relationships, state and findings
      - Trace why it exists and what realizes it
      - Make the change on a branch
      - Ask what the change affects, against the main-line revision, and check those Requirements again
    completion: The change names the records it affects, and their verification is checked again
    exceptions:
      - The model doesn't load (fix the config first)

  - id: REQ-012
    type: Requirement
    name: Answer questions from config and state
    description: The same answers for people (as text) and agents (as JSON), computed from the model.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-24"
    statement: >-
      Given a model's config and state, show a record with its relationships, state and findings; trace why it
      exists up to Outcomes and how it is realized; list what a change to records, or between two revisions,
      affects; and list the model's gaps beyond conformance.
    acceptance_criteria:
      - Show gives the record, its document, its relationships in both directions, its state and pending work by context, and the findings that name it.
      - An unknown record is an error that suggests close IDs; a reference qualified with the model's namespace works.
      - Trace follows supports, uses_capability, contributes_to, implements, evaluates and stores up, and uses, reads, writes, depends_on and contains the other way, marking a record reached twice instead of repeating its branches.
      - Impact lists every record that relies on the changed ones with the shortest path, the Outcomes reached, and the Requirements to check again with their bindings.
      - Impact against a Git revision lists records added, changed (with the fields) and removed, and relationships added and removed, and traces removals in the earlier model.
      - Gaps lists the validator's findings, Requirements not verified or not released in any context, Requirements without a binding, proposed Measures and pending work.
      - Every answer is available as JSON.
    verification_method: Query tests in CI.
    observe:
      tests:
        workflow: .github/workflows/spec.yml
        cases:
          - "validator/tests/test_query.py::*"

  - id: REQ-013
    type: Requirement
    name: Answer coding agents over MCP
    description: Agents ask the model the same questions as people, through the Model Context Protocol.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-24"
    statement: >-
      Serve show, trace, impact and gaps as MCP tools over stdio, reading the model again on each call, with the
      text answer as content and the JSON answer as structured content.
    acceptance_criteria:
      - Initialize agrees on the client's protocol version when supported, and otherwise offers the newest.
      - Tools are listed with descriptions and input schemas, one per question.
      - A question the model can't answer, such as an unknown record, is a tool result marked as an error.
      - An unknown tool is an invalid-params error; an unknown method is a method-not-found error; a line that is not JSON is a parse error.
      - Notifications get no response.
    verification_method: MCP server tests in CI.
    observe:
      tests:
        workflow: .github/workflows/spec.yml
        cases:
          - "validator/tests/test_mcp.py::*"

  - id: APP-003
    type: Application
    name: Query
    description: The exacly command's show, trace, impact and gaps, and the query core behind them.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-24"
    responsibility: Answer questions about a model from its config and state.
    interfaces: [exacly command, exacly_validate.query Python API]
    implementation_ref: { locator: validator/src/exacly_validate/query.py }

  - id: APP-004
    type: Application
    name: MCP server
    description: The exacly mcp command, which coding agents start, and the skill that tells them when to ask.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-24"
    responsibility: Answer coding agents' questions about a model over the Model Context Protocol.
    interfaces: [exacly mcp command (MCP over stdio), skills/exacly/SKILL.md]
    implementation_ref: { locator: validator/src/exacly_validate/mcp.py }

relationships:
  - { source: CAP-003, type: contributes_to, target: OUT-001 }
  - { source: PROC-003, type: uses_capability, target: CAP-003 }
  - { source: PROC-003, type: uses, target: APP-003 }
  - { source: REQ-012, type: supports, target: PROC-003 }
  - { source: APP-003, type: implements, target: REQ-012 }
  - { source: APP-003, type: reads, target: INFO-001 }
  - { source: APP-003, type: reads, target: INFO-002 }
  - { source: APP-003, type: depends_on, target: APP-001, conditions: Uses the validator to load the model and for findings. }
  - { source: REQ-013, type: supports, target: PROC-003 }
  - { source: APP-004, type: implements, target: REQ-013 }
  - { source: PROC-003, type: uses, target: APP-004 }
  - { source: APP-004, type: depends_on, target: APP-003, conditions: Every tool is a question the query core answers. }
