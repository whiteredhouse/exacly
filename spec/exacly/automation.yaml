# Automation contracts for local completion, isolation, dispatch, executor supervision and output handoff.
# Lifecycle describes the supported contract; observed verification and release remain separate.
exacly: "0.2.0"

records:
  - id: CAP-004
    type: Capability
    name: Reconcile approved verification work
    description: Carry a reviewed verification goal through authorized work to observation-confirmed completion, including the proposed bounded unattended path.
    owner: exacly-maintainers
    lifecycle: proposed
    evidence:
      - locator: docs/automated-plan-apply-research.md
        kind: research
        claim: Research recommends durable dispatch, observation-confirmed completion and bounded executor adapters.
        observed_at: "2026-10-28"
        applies_to: Proposed automation roadmap
    last_reviewed_at: "2026-10-31"
    scope: Explicitly authorized verification work, local completion, task dispatch, bounded candidate execution and source publication to approved verification destinations; unattended effects require independently approved standing delegation, while broader implementation planning, PR merge, release and deployment remain separately scoped proposals.

  - id: PROC-004
    type: Process
    name: Carry out approved verification work
    description: The proposed authorized loop from a reviewed verification plan to evidence for its resulting implementation, attended or controlled by approved standing delegation.
    owner: exacly-maintainers
    lifecycle: proposed
    evidence: []
    last_reviewed_at: "2026-10-31"
    perspective: business
    actors: [Operator, Exacly, Standing authorizer, Workflow controller, Task adapter, Isolated executor, Trusted evidence producer]
    trigger: An operator authorizes a reviewed verification action directly or approves a bounded delegation that can authorize its exact current effects
    steps:
      - Check the reviewed plan, policies, current state and selected action before committing any authorized effect
      - For existing work, select its active registered binding; for new work, persist dispatch intent and recover or create one traceable task
      - When candidate execution is authorized, run a bounded adapter within an enforced isolation boundary
      - When output requires remote verification, hand approved artifacts to an exact source commit and separately authorize its permitted remote publication and producer selection
      - Identify the resulting implementation and admit fresh evidence against the unchanged approved model contract
      - Evaluate the selected goal against current state merged with admitted observations
      - Publish completion of the exact pending item through a recoverable intent and receipt protocol
      - For a delegated unattended workflow, reobserve and resume eligible work within its original objective-wide budgets, retaining phase history and escalating effects outside its authority
    completion: The selected verification task has matching admitted evidence, published state and a durable completion receipt
    exceptions:
      - Changed criteria, bindings, policy, scope or active registration require explicit replanning or supersession
      - Missing, failed or incomplete evidence leaves work pending even when an executor finishes or a PR merges
      - Ambiguous external dispatch outcomes require discovery by stable identity before another create request
      - An interrupted publication requires recovery from its durable intent; divergent state requires explicit conflict resolution
      - Isolation setup failure or an exhausted execution budget stops candidate execution and records the reason
      - Expired or revoked delegation stops new effects; uncertain in-flight operations preserve their history and separately approved recovery semantics

  - id: REQ-024
    type: Requirement
    name: Complete registered verification work from admitted observations
    description: Close one exact local pending item only through explicit authority, applicable evidence and recoverable publication.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-29"
    statement: >-
      Given explicit operator completion authorization, one active execution binding and fresh admitted
      evidence for its output target, complete only the registered pending verification item when the
      merged current state satisfies the unchanged goal, preserving unrelated work and durable history.
    acceptance_criteria:
      - Invoking exacly complete github-actions explicitly authorizes local completion scoped to its binding, goal, output target, policies and state destination; registration, a saved plan digest and a ready preview alone do not grant mutation authority, and no confirmation prompt or extra authorization flag is required.
      - Each new completion evaluation performs fresh live admission for the exact output revision, run and attempt under the approved producer policy; executor self-reports, PR merge and imported receipts cannot substitute for admission.
      - The approved model, criteria, bindings and readiness and trust policies remain the registered contract; the resulting implementation may differ from the planning input without relabeling retained observations.
      - Validate the actual current state against the approved model before merging; recheck the active binding, complete pending-entry identity, lineage, serial, digest and registered watermark at commit time, rejecting stale or corrupt inputs without pruning unrelated work.
      - Apply admitted observations through the existing source and binding replacement rules, preserving unrelated assessments, evidence, relationships and pending entries, then evaluate the selected goal against the merged candidate state; retained applicable failures or missing required observations prevent completion.
      - Remove only the exact registered pending entry after the selected goal is satisfied; preserve namespace, context and lineage and advance the serial exactly once, while reporting whole-policy readiness separately from completion of this action.
      - Retain the admitted evidence bytes and receipt with their identities and digests, and commit a prepared completion intent containing the exact before-state identity and candidate after-state bytes and digest before conditional publication; publish those exact recorded bytes rather than reserializing a different candidate.
      - Hold the ledger and state locks in a deterministic deduplicated order through intent preparation, conditional atomic state publication and receipt finalization; bounded waits and unresolved intents prevent conflicting registration changes.
      - Completion, completion inspection, recovery and exact replay reuse one full retained-history validation within each unchanged protected database view; any mutation invalidates that view and requires fresh validation before reuse, unexpected database changes fail closed, and reuse ends with the protected operation or connection.
      - SQLite ledger updates and JSON state publication form a recoverable protocol rather than one atomic transaction; failures after replacement preserve the complete published state and prepared intent and report the unfinished operation.
      - Repeating the exact completed request, including binding, state destination, plan and action, policies, target, run, attempt and evaluation date, returns its original durable receipt without HTTP, removing another task or increasing the serial again; a different request cannot reuse a completed binding or pending identity.
      - Explicit offline recovery aborts an intent when the exact before-state remains and requires fresh admission for another attempt; when the exact after-state is present it verifies the retained proof and binding, synchronizes the state and directory and finalizes once without HTTP; any third state conflicts without overwrite or replay of a stale candidate.
      - Completion supports operational ledger schema version 2 or explicitly activated version 4; version 1 requires explicit copy-only upgrade and version 3 remains audit-only, while ordinary reads, registration and completion never silently migrate, activate or recover a ledger.
      - Version-4 completion and abort transactions maintain integrity baselines and affected terminal verdicts atomically with the actual phase, receipt and watermark changes; prepared proof always receives fresh semantics, and recognized stale profiles block new completion writes until explicit activation refreshes the profile.
      - Show reads the retained completion phase without exposing raw proof bytes; completion reports distinguish completed, pending, stale and conflict, and preserve unfinished intent after an operational error. Receipts describe historical completion rather than authenticating the latest state, test honesty, acceptance coverage or executor-to-output provenance.
      - Complete exits 0 only for completed and 1 for an unmet, stale or conflicting result; show exits 0 for a valid retained phase, offline recovery exits 0 for completed or aborted and 1 for an unresolved result, and invalid inputs or operational errors exit 2. Optional report-output failure does not undo an already recorded completion.
      - Local completion records observation-confirmed verification without closing an external ticket, dispatching an agent, granting release authority or claiming a machine-verified executor-to-output link.
    verification_method: Completion contract, command, storage, concurrency and process-kill tests at durable boundaries, including supersession races, exact request replay and retained failing observations.
    observe:
      tests:
        cases:
          - "python/tests/test_completion.py::*"
          - "python/tests/test_completion_cli.py::*"
          - "python/tests/test_completion_faults.py::*"
          - "python/tests/test_completion_store.py::*"
          - "python/tests/test_completion_locks.py::*"
          - "python/tests/test_completion_validation.py::*"
          - "python/tests/test_completion_journal.py::*"
          - "python/tests/test_execution_history_reuse.py::*"
          - "python/tests/test_execution_history_reuse_faults.py::*"
          - "python/tests/test_execution_history_reuse_crashes.py::*"

  - id: REQ-025
    type: Requirement
    name: Isolate candidate execution from operator authority
    description: Candidate code cannot reach the authority used to approve, dispatch or complete its work through the selected runtime boundary.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    statement: >-
      Before running candidate-controlled code, enforce an execution boundary that denies access to
      the operator's ledger, authoritative state and policy originals, privileged credentials and
      control interfaces, while providing only explicitly permitted inputs and capabilities.
    acceptance_criteria:
      - Explicit candidate execution authorizes only the selected argument vector, reviewed backend and runtime policy, immutable input snapshots and new output destination; it grants no dispatch, verification, completion, release or deployment authority.
      - Candidate processes and their descendants cannot read or modify the operator's execution ledger, completion journal, authoritative state, policy originals or privileged credentials through filesystem, environment, process, performance-monitoring, kernel credential facilities or control interfaces.
      - Enforce separation through an independently enforced runtime boundary with a reviewed contract; same-user directory permissions, path checks, a separate checkout or a successful version probe alone do not establish isolation.
      - Verify the selected runtime's identity and permitted inputs against reviewed policy before execution; candidate-controlled configuration cannot add capabilities, replace required protections or expose operator runtime files and interfaces.
      - Approved criteria and permitted source inputs are supplied as explicit immutable path-to-bytes snapshots; input paths cannot escape that snapshot, and no implicit repository traversal or environment inheritance supplies additional inputs.
      - Verify the actual execution boundary before candidate code starts; a backend name or candidate self-report alone is insufficient, and an unavailable or failed boundary stops execution without falling back to the operator runtime.
      - Filesystem, network and subprocess capabilities are explicitly constrained by the selected backend's reviewed contract; inherited environment, unrelated descriptors, privileged mounts and runtime-management interfaces cannot bypass the boundary, and descendant processes remain confined.
      - Completion, timeout, output limits and supervisor termination stop candidate processes and descendants according to the backend contract; actual termination is verified before artifact collection, including after normal candidate exit. Per-run cleanup limits do not establish durable retry or concurrency budgets.
      - Collect bounded logs and artifacts without following candidate-controlled paths into operator resources or accepting unsafe file types; invalid setup or unsafe artifacts publish no successful bundle, and publishing a new private bundle never overwrites an existing destination.
      - Reports identify the selected backend, reviewed runtime and supplied snapshot identities and verified boundary facts separately from untrusted candidate exit status, logs and artifacts; content identity and successful execution do not authenticate evidence, prove output provenance or authorize completion.
      - Real integration tests for each supported backend attempt forbidden reads, writes, inherited-descriptor access, host process access, cross-boundary performance monitoring, kernel credential access and host network or socket access from candidate processes and descendants; they also verify immutable permitted inputs, safe output exchange, failed setup and descendant cleanup without substituting mocked or skipped runtime checks.
      - Each supported backend declares its required protections, trusted components and exclusions in a reviewed contract. The current local linux-bubblewrap-v1 backend must satisfy docs/candidate-isolation.md#linux-bubblewrap-v1-backend-contract in full; another backend needs its own reviewed contract and real verification before support can be claimed.
      - Trusted local completion of existing work does not require launching candidate code; this isolation requirement becomes mandatory before an executor runs candidate-controlled code, while durable dispatch and executor attempt supervision retain their own requirements.
    verification_method: Real integration tests of the currently supported local Linux Bubblewrap backend for namespace and kernel-interface denials, descendants, input immutability, safe artifacts, failed setup and termination, plus policy, snapshot, publication and CLI contract tests; these establish no support for another backend.
    observe:
      tests:
        cases:
          - "python/tests/test_execution_isolation.py::*"
          - "python/tests/test_isolation_contract.py::*"
          - "python/tests/test_isolation_cli.py::*"
          - "python/tests/test_isolation_syscalls.py::*"

  - id: REQ-026
    type: Requirement
    name: Dispatch approved work without duplicate external tasks
    description: A reviewed action can create one traceable task despite concurrent dispatchers, retries and ambiguous responses.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    statement: >-
      Under explicit dispatch authorization, persist intent for a reviewed action before creating
      external work, recover an existing task by stable identity before retrying, and retain an
      auditable association between the action, pending work and adapter result.
    acceptance_criteria:
      - Dispatch requires explicit reviewed authorization for the selected action, destination, adapter and permitted effect; a saved plan or readiness result alone does not grant permission to create work.
      - Recheck the approved plan, criteria, bindings, policies, target and actual current state before dispatch; stale contracts require replanning, and a goal already satisfied is recorded as superseded without creating another task.
      - Dry-run renders the same selected action, preconditions and intended external effect without creating tasks or modifying state, ledger records or watermarks.
      - Persist a stable dispatch identity and intent before the first external create request; scope the adapter marker to the persistent identity of the authorized repository or destination and reviewed action rather than mutable repository names, state serials or diagnostic text.
      - Concurrent workers sharing the explicitly selected canonical dispatch journal and repeated applies recover the same task by its stable identity; persist the creating phase before sending a create request, never send another create after a possibly sent request, and retain an unresolved ambiguous result when complete discovery finds no match. Multiple matching tasks produce an explicit conflict.
      - The first adapter supports one explicitly selected GitHub task destination, with repository and adapter settings supplied by reviewed policy rather than library defaults for workflow or test paths.
      - Retain attempts, remote task identity, immutable receipts and partial successes; bounded retries resume unfinished work without replacing successful history or fabricating external rollback.
      - Explicitly initialize a private dispatch journal outside candidate storage and Git working trees; pin its unique initialization identity and the canonical absolute journal, execution-ledger and actual state paths in both reviewed policy and authorization before remote effects. Retain this storage contract with each intent and keep dispatch history separate without changing existing execution-ledger formats. Ordinary apply and inspection reject interrupted SQLite journals; explicit recovery validates protected storage before resolving the interrupted transaction.
      - Associate a confirmed task with one unambiguous pending verification entry and its reviewed execution binding through recoverable ledger and conditional state writes; ambiguity or changed pending work blocks registration rather than linking a different task.
      - When a retained registration preparation can no longer satisfy its original contract, a read-only resolution preview captures the pinned journal instance and history head, explicit reason and exact current storage, state, pending and binding facts. Separately reviewed authorization for those facts permits only one terminal resolved receipt in the journal; any changed precondition blocks it. Resolution preserves current state, pending work, bindings and remote tasks, leaves registration unfinalized and never grants another create for the dispatch identity.
      - Replanning, cancellation and retirement preserve history and require explicit supersession or separately reviewed journal-only resolution; retiring a record or task never authorizes destruction of implementation. Ordinary registration recovery retains its original contract and current-state guards.
      - Task creation, issue closure, agent completion reports and PR merge leave verification pending until the separately authorized completion path admits sufficient applicable evidence.
    verification_method: Dispatch contract, command, adapter, private-journal and explicit resolution tests with controlled GitHub responses, concurrent workers and process termination around external creation, state publication, binding registration and receipt persistence, including model drift and resolution authorization pinned to reviewed current facts.
    observe:
      tests:
        cases:
          - "python/tests/test_dispatch.py::*"
          - "python/tests/test_dispatch_cli.py::*"
          - "python/tests/test_dispatch_faults.py::*"
          - "python/tests/test_dispatch_store.py::*"
          - "python/tests/test_github_dispatch.py::*"
          - "python/tests/test_dispatch_resolution.py::*"

  - id: REQ-027
    type: Requirement
    name: Bound authorized executor attempts
    description: A reviewed local snapshot command has durable attempt and concurrency limits and returns content-identified outputs without controlling verification or completion.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    statement: >-
      Run one explicitly approved executor adapter within the enforced isolation boundary and
      declared attempt, time and concurrency limits, retaining durable outcomes and produced
      implementation identities for independent evidence evaluation.
    acceptance_criteria:
      - The initial local-bubblewrap-v1 adapter receives explicit immutable input snapshots and copied metadata for the authorized task, Requirement, approved goal, criteria and binding fingerprints, input implementation, dependencies and expected observations; no implicit repository traversal or operator storage handles are supplied.
      - Dry-run launches no worker or candidate and changes no state, binding, watermark, attempt or output. Apply requires separately reviewed authorization binding the initialized journal and canonical storage scope, selected contract, actual history head, next attempt ordinal, exact current state and output destination; stale preconditions block execution.
      - Recheck the approved plan, policies, target, actual state, exact pending verification task and active execution binding before reserving a new attempt; contract drift, completed work or a changed binding prevents new execution.
      - Explicit policy bounds attempts and the worker's wall-clock time through staging, isolated execution and collection. Explicit journal initialization fixes shared concurrency capacity. The first adapter permits no repository effects; retries, changed policies and failures cannot expand retained limits or infer new authorization.
      - Before starting the adapter, commit durable work and attempt identities, reviewed limits, status and the shared concurrency reservation in an explicitly initialized private companion journal. Existing version-2 and version-4 binding/completion ledgers retain their formats and ordinary operations never silently initialize, migrate or recover storage.
      - Supervision, inspection, cancellation and recovery consume explicitly selected attempt-storage, invocation-ownership and worker-lifecycle protocols; the default local adapters preserve the existing policy, authorization, journal and result contracts, and candidate-controlled inputs cannot select another provider.
      - Candidate code runs only through the verified local Bubblewrap launcher satisfying REQ-025, with no host-execution fallback, network or writable host repository mount. The full worker budget and process cleanup remain under the trusted supervisor.
      - Return the registered task reference, execution outcome, retained output references and an immutable host-derived build identity computed from collected artifact paths and content. Missing required outputs or ambiguous identity prevents a successful result; candidate-provided revision claims do not establish output provenance.
      - Timeout, cancellation, failure and supervisor interruption are observable and recoverable from retained history without requiring an unchanged model or state. An exclusive per-invocation ownership lock distinguishes active supervision from an idle long-lived API process; a cancellation request for an active invocation makes no immediate termination claim. Recovery reconciles or terminates the existing attempt before releasing its slot or permitting another; missing ownership facts or uncertain process identity never authorize signaling a reused PID or starting replacement work.
      - Each retry needs fresh authorization for its next ordinal within the original attempt budget. Preserve consumed attempts, successful outcomes and partial-failure history; exact successful replay returns its retained receipt rather than executing again, and exhausted limits stop further execution with an actionable reason.
      - Use bounded lock waits and protected explicit backup before journal-only SQLite recovery; neither repair nor attempt recovery resets limits, starts candidate code, changes state or repairs a different ledger.
      - Executor success, collected artifacts and a merged PR are execution outcomes only; the supervisor cannot write verification assessments, alter the approved contract, admit evidence, finalize completion receipts or remove pending work. Build identity identifies bytes rather than test honesty, acceptance coverage or a later revision's provenance.
    verification_method: Executor contract, command, private companion-store and process-fault tests with real Bubblewrap integration, explicit authorization, shared concurrency, attempt and wall-clock enforcement, required output identity, cancellation, timeout, supervisor termination and model-independent recovery.
    observe:
      tests:
        cases:
          - "python/tests/test_executor.py::*"
          - "python/tests/test_executor_cli.py::*"
          - "python/tests/test_executor_faults.py::*"
          - "python/tests/test_executor_store.py::*"
          - "python/tests/test_executor_runtime.py::*"

  - id: REQ-031
    type: Requirement
    name: Compose coordinator backends through checked lifecycle contracts
    description: Trusted coordinator implementations share explicit storage, ownership and worker protocols while preserving authorization, recovery and isolation obligations.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    statement: >-
      Execute the coordinator lifecycle through explicitly composed attempt-storage,
      invocation-ownership and worker interfaces whose checked scope, atomic limits and
      recovery semantics preserve the approved work contract across implementations.
    acceptance_criteria:
      - Publish typed attempt-storage, checked-session, invocation-lease and worker-lifecycle protocols, with explicit scope and versioned backend composition; the coordinator uses these interfaces for supervision, inspection, cancellation and recovery rather than only declaring structural types.
      - Select implementations only through trusted Python construction. Preserve the local CLI and its closed reviewed policy; candidate configuration cannot discover plugins, load providers, replace the backend bundle or gain additional effects.
      - A checked storage session owns its serialization and transaction boundary, exposes no SQLite connection or directory descriptor to orchestration, returns a checked canonical store locator and initialized instance identity, atomically enforces the immutable attempt and shared concurrency budgets, and preserves committed history and exact replay.
      - Pass the current opaque invocation claim for the exact initialized store, work identity, ordinal and output to owned storage transitions and worker effects; implementations recognize their actual issuer and reject released, stale or differently scoped ownership at the effect boundary. The only unowned attempt mutation is a cancellation request for the current unresolved attempt, which grants no launch or capacity-release authority.
      - Worker supervision includes gated launch, status, cancellation and the full deadline. Durable callbacks retain provider-owned worker and execution-boundary identities before release; live worker handles bind those retained identities to the selected attempt reference. Inspection alone cannot release capacity, and reconciliation rejects another invocation's handles and verifies termination of the exact retained workers before a terminal outcome frees its slot.
      - Before appending a worker or execution-boundary callback, detach its provider-owned identity data and validate the complete proposed event against the selected identity codec and checked history. Malformed identities, duplicate or out-of-order callbacks and later mutation of supplied documents cannot introduce unusable retained history. A rejected callback grants no candidate release; inspection, cancellation and recovery remain available, and capacity is retained until verified termination permits a terminal outcome.
      - Validate a complete proposed terminal outcome against the selected checked history before appending it; an unknown or non-string worker status, invalid worker result or insufficient termination facts leaves the attempt unresolved and its capacity occupied rather than committing an unusable receipt. Explicit candidate failure, timeout, output-limit and cancellation outcomes remain unsuccessful even when a complete output bundle is present.
      - Keep provider-specific process identity parsing and physical runtime controls inside the trusted local adapters. Default local identity and history validation remain strict, preserve existing version-1 attempt records and version-2 or version-4 binding ledgers, and do not reinterpret candidate reports as trusted termination evidence.
      - Protocol version 0.1.0 accepts only the existing local-bubblewrap-v1 contract adapter and one local-machine coordination domain with matching storage, ownership and worker implementations. Unsupported scope or adapter, or a mismatched domain, fails before effects; a lease heartbeat or a check followed by an unrelated write is not a distributed fencing guarantee.
      - Any future distributed backend must specify and independently verify ownership epochs or fencing tokens enforced atomically by storage transitions and worker commands, together with takeover and reconciliation behavior. It must preserve authoritative work identities, consumed budgets and immutable history through an explicit migration before support is claimed.
      - Run common conformance cases against the local adapters and an independent reference implementation for immutable contracts, atomic reservations, bounded attempts and concurrency, stale ownership, cancellation, replay and recovery. Reference implementations establish protocol semantics only; backend-specific process-kill durability and real REQ-025 isolation tests remain necessary.
      - Composing a backend supplies no verification, evidence-admission, completion, release or repository-mutation authority. Runtime support still requires a reviewed backend contract and actual enforcement evidence, not a compatible Python type or provider assertion alone.
    verification_method: Shared local and independent-reference backend conformance cases, coordinator substitution tests with opaque worker identities, strict legacy-format and local ownership tests, plus the existing real executor and isolation suites.
    observe:
      tests:
        cases:
          - "python/tests/test_executor_interfaces.py::*"
          - "python/tests/test_coordinator_backends.py::*"
          - "python/tests/test_executor_local.py::*"

  - id: REQ-033
    type: Requirement
    name: Hand reviewed executor artifacts to an exact Git revision
    description: Retained successful artifacts become a host-constructed source revision through separately authorized recoverable local ref publication.
    owner: exacly-maintainers
    lifecycle: active
    evidence: []
    last_reviewed_at: "2026-10-30"
    statement: >-
      Given one retained successful executor attempt, an approved artifact-to-source mapping and
      exact local Git destination, preview and separately authorize construction and publication
      of one content-identified implementation revision while preserving execution history,
      unrelated source content and independent evidence and completion authority.
    acceptance_criteria:
      - The first local-git-v1 adapter accepts only an explicitly initialized owner-private bare SHA-1 Git repository with a retained initialization identity and reviewed sealed configuration. Its separate private handoff journal pins that repository identity and the canonical storage scope; ordinary operations never initialize, replace or silently migrate either resource.
      - Read the selected successful attempt from its canonical initialized executor journal and validate its retained contract, immutable receipt, build identity and exact artifact roster. Retain the complete source contract and require its digest to match the receipt authorization before using its approved model, context or input target; the base revision must equal that retained input target revision. Imported receipt JSON and candidate revision claims do not establish handoff authority.
      - A closed reviewed policy pins the handoff and executor journal paths and identities, repository path and identity and literal permitted destination paths or directory prefixes. Candidate output cannot select another repository, broaden allowed paths or replace protected operator resources.
      - Read-only preview and each newly authorized apply validate the complete base object closure, including unrelated files, before returning a ready proposal or preparing durable intent; missing or corrupt objects leave the journal, Git objects and refs unchanged. Preview checks the expected destination ref and bounded safely opened artifact bytes, then returns the exact mapped changes, proposed tree and commit and separate authorization template without writing objects, refs, journal history, state or bindings.
      - New publication requires separate exact authorization pinning the policy, initialized storage scope, execution and attempt, retained receipt and build, base revision, expected destination value, path mapping, artifact identities and deterministic commit metadata. Changed preconditions reject the request rather than infer renewed approval.
      - Map only explicitly selected bounded regular-file artifacts to permitted normalized source paths. Reject traversal, ambiguous or colliding mappings and paths targeting or traversing symbolic links, submodules or unsafe destination components; preserve unrelated base tree entries and existing regular-file modes, using mode 100644 for new ordinary files. The first adapter supplies no deletion, executable-bit selection, checkout or working-tree mutation.
      - Trusted operator code constructs the exact Git blobs, tree and single-parent commit from the pinned base and approved artifact bytes. Fixed Git plumbing uses a sanitized execution environment and sealed repository settings; candidate-controlled hooks, configuration, filters, replacement objects, alternates, credential helpers and network access cannot influence publication.
      - Before any Git object or ref write, durably prepare the complete authorized handoff, exact required object bytes and resulting identities in the separate initialized journal. Storage and repository coordination use deterministic ordered locks, bounded waits and checked private resources without changing executor or binding/completion journal formats.
      - Publish only the explicitly selected local branch ref by compare-and-swap against either the authorized base revision or an authorized absent destination. A changed ref conflicts without overwriting it, changing another ref or treating a clock or stale preview as publication authority.
      - A durable immutable provenance receipt identifies the source executor attempt, original build and selected artifact roster and mapping, repository identity, base and resulting tree/commit, local destination ref and authorization. It proves this trusted byte-to-tree handoff rather than test honesty, acceptance coverage or a later revision's provenance.
      - Exact replay returns the retained result without consuming another executor attempt, constructing a different commit or repeating a successful publication. Preserve prepared intent and receipt history through interruption; a different request cannot reuse the same immutable handoff identity.
      - Explicit model-independent recovery validates retained object bytes and the initialized repository and journal, publishes only while the exact authorized before-ref remains, finalizes only when the exact proposed after-ref is present, and reports conflict for any third value. Missing required base objects or uncertain publication facts remain unresolved; recovery never replaces divergent refs or rereads changed candidate output as authority.
      - Ordinary journal operations refuse interrupted SQLite sidecars. Separately authorized journal-only repair preserves protected exact backups before recovery and grants no Git publication, execution, budget-reset, state, evidence or completion authority.
      - Handoff returns the resulting source target with the retained approved model revision and context. Binding supersession, remote push, producer execution, evidence admission, completion, release and deployment remain separately authorized; no local handoff result alone removes pending work or supplies a successful verification claim.
      - End-to-end acceptance coverage connects a reviewed plan, durable dispatch, real isolated execution and reviewed handoff to separately associated trusted source evidence and completion. Wrong-revision evidence, changed artifacts, stale refs, replay and interrupted publication remain distinguishable, with unrelated work and authoritative execution and completion history preserved.
    verification_method: Handoff contract, sealed local Git plumbing, journal, command and process-fault tests plus an end-to-end pilot using real isolated execution and controlled trusted-evidence responses; no live remote publication is inferred from the controlled evidence fixture.
    observe:
      tests:
        cases:
          - "python/tests/test_handoff*.py::*"

