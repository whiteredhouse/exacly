name: Release

# Pushing a python-vX.Y.Z tag publishes the exacly package X.Y.Z to PyPI.
# PyPI trusts this workflow and the pypi environment (trusted publishing), so no token is stored.
on:
  push:
    tags: ["python-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux isolation test runtime
        run: sh ci/setup_isolation_runtime.sh
      - name: Check the Linux isolation test runtime
        run: /usr/bin/python3 ci/check_isolation_runtime.py
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(uv version --short)"
          if [ "$TAG" != "python-v$version" ]; then
            echo "::error::Tag $TAG does not match the package version $version in pyproject.toml"
            exit 1
          fi
      - name: Verify the release prerequisites
        run: mise run check
      - name: Build the sdist and wheel
        run: uv build
      - name: Run the built wheel outside the repository
        run: |
          set -euo pipefail
          wheel="$(ls "$PWD"/dist/*.whl)"
          example="$PWD/spec/examples/0.2/invoice-reminders"
          smoke="$PWD/ci/smoke.py"
          evidence_smoke="$PWD/ci/smoke_evidence.py"
          policy_smoke="$PWD/ci/smoke_policy.py"
          composition_smoke="$PWD/ci/smoke_composition.py"
          automation_smoke="$PWD/ci/smoke_automation.py"
          cd "$RUNNER_TEMP"
          uvx --isolated --from "$wheel" exacly validate "$example"
          uv run --isolated --no-project --with "$wheel" python "$smoke" --example "$example"
          uv run --isolated --no-project --with "$wheel" python "$evidence_smoke" --archive evidence-compatibility.zip
          # The wire protocol is independent of the tool release. RC2 consumes the new producer's bundle.
          uv run --isolated --no-project --default-index https://pypi.org/simple \
            --with 'exacly==0.6.0rc2' python "$evidence_smoke" --consume evidence-compatibility.zip
          uv run --isolated --no-project --with "$wheel" python "$policy_smoke"
          uv run --isolated --no-project --with "$wheel" python "$composition_smoke"
          uv run --isolated --no-project --with "$wheel" python -I "$automation_smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/exacly/${{ steps.version.outputs.version }}
    permissions:
      # Only this job can mint the token PyPI exchanges for an upload.
      id-token: write
    steps:
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#python-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify-publication:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux isolation test runtime
        run: sh ci/setup_isolation_runtime.sh
      - name: Check the Linux isolation test runtime
        run: /usr/bin/python3 ci/check_isolation_runtime.py
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      - name: Install the published version, allowing for index propagation
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          installer="$PWD/ci/install_publication.py"
          cd "$RUNNER_TEMP"
          python "$installer" --version "${TAG#python-v}" --environment "$RUNNER_TEMP/exacly-publication"
      - name: Exercise the published package
        run: |
          set -euo pipefail
          example="$PWD/spec/examples/0.2/invoice-reminders"
          smoke="$PWD/ci/smoke.py"
          evidence_smoke="$PWD/ci/smoke_evidence.py"
          policy_smoke="$PWD/ci/smoke_policy.py"
          composition_smoke="$PWD/ci/smoke_composition.py"
          automation_smoke="$PWD/ci/smoke_automation.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/exacly-publication/bin/python" "$smoke" --example "$example"
          "$RUNNER_TEMP/exacly-publication/bin/python" "$evidence_smoke" --archive published-evidence-compatibility.zip
          uv run --isolated --no-project --default-index https://pypi.org/simple \
            --with 'exacly==0.6.0rc2' python "$evidence_smoke" --consume published-evidence-compatibility.zip
          "$RUNNER_TEMP/exacly-publication/bin/python" "$policy_smoke"
          "$RUNNER_TEMP/exacly-publication/bin/python" "$composition_smoke"
          "$RUNNER_TEMP/exacly-publication/bin/python" -I "$automation_smoke"
