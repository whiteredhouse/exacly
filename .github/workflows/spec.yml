name: Spec

on:
  pull_request:
    paths: &paths
      - "spec/**"
      - "validator/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - ".github/workflows/spec.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Test, lint, type-check and validate the examples
        run: mise run check
