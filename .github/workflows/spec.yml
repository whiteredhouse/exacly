name: Spec

on:
  pull_request:
    paths:
      - "spec/**"
      - "python/**"
      - "pyproject.toml"
      - "uv.lock"
      - "mise.toml"
      - "tests/**"
      - "ci/**"
      - ".github/workflows/spec.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/verification-evidence.yml"
  # Every push to main runs, whatever it changed, so that the latest main always gets a state job.
  # The state job's own commits carry [skip ci] and don't start another run.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux isolation test runtime
        run: sh ci/setup_isolation_runtime.sh
      - name: Check the Linux isolation test runtime
        run: /usr/bin/python3 ci/check_isolation_runtime.py
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Test, lint, type-check, validate the examples, and refresh and validate Exacly's own state
        run: mise run check

  plan:
    # The change plan (section 10's change impact view) as a comment on the pull request, kept up to date.
    # A pull request from a fork gets a read-only token, so it isn't commented on.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      # A newer push replaces a plan still being written, so two runs can't both add a comment.
      group: exacly-plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Write the plan against the base branch
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mise run sync
          # The config alone: the committed state belongs to main and can name records this change removes.
          uv run --locked exacly view plan --base "origin/$BASE" -m 'spec/exacly/*.yaml' > plan.md
          cat plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment the plan, replacing the earlier one
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read every page: closing the pipe early can fail gh with SIGPIPE when duplicate comments exist.
          comment="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- exacly-plan -->"))) | .id' \
            | sed -n '1p')"
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@plan.md > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@plan.md > /dev/null
          fi

  state:
    # State is written only by tooling and committed only from main (spec section 9).
    # This job reruns the checks rather than reusing the check job's reports, so that only
    # it holds a token that can write, and only on main.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: exacly-state
      cancel-in-progress: false
      # Keep every pending state job: by default a newer pending job replaces an older one, so an older
      # revision whose checks finish late would cancel the newest revision's state job.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux isolation test runtime
        run: sh ci/setup_isolation_runtime.sh
      - name: Check the Linux isolation test runtime
        run: /usr/bin/python3 ci/check_isolation_runtime.py
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: Refresh Exacly's own state
        run: mise run model
      - name: Commit the state to main
        run: |
          set -euo pipefail
          mkdir -p spec/exacly/state
          cp reports/state/main.json spec/exacly/state/main.json
          git add spec/exacly/state/main.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Refresh Exacly's own state for ${GITHUB_SHA::7} [skip ci]"
          if git push origin HEAD:refs/heads/main; then
            exit 0
          fi
          # A rejection is expected only when main moved on: that push started its own run, whose state job
          # follows this one and refreshes the state for the newer main. Anything else is a failure.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved on to $(git rev-parse --short origin/main); its own run refreshes the state"
            exit 0
          fi
          echo "::error::Could not push the state to main, which is still at ${GITHUB_SHA::7}"
          exit 1
