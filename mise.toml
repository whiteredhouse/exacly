# Tools and tasks for working on this repository. Run `mise run check` before pushing; CI runs the same.

[tools]
python = "3.12"
uv = "0.11.32"

[tasks.sync]
description = "Install the validator and development tools into .venv from uv.lock"
run = "uv sync --locked"

[tasks.test]
description = "Run the schema and validator test cases"
depends = ["sync"]
# Each test case's result goes to reports/junit.xml, which the model task reads.
run = "uv run --locked pytest spec/tests validator/tests tests --junitxml=reports/junit.xml"

[tasks.lint]
description = "Check style and formatting with Ruff"
depends = ["sync"]
run = ["uv run --locked ruff check", "uv run --locked ruff format --check"]

[tasks.typecheck]
description = "Type-check with mypy"
depends = ["sync"]
run = "uv run --locked mypy"

[tasks.examples]
description = "Validate every example: each 0.1 product map, and each 0.2 config folder"
depends = ["sync"]
run = 'for f in spec/examples/0.1/*.yaml spec/examples/0.2/*/; do uv run --locked exacly-validate "$f" || exit 1; done'

[tasks.model]
description = "Refresh Exacly's own state from the test results into reports/state/, and validate it with the config"
# It runs only once every other check has passed, so the job status it reports is success.
depends = ["test", "lint", "typecheck", "examples"]
run = """
set -e
revision="$(git rev-parse HEAD)"
mkdir -p reports/state
rm -f reports/state/main.json
if [ -f spec/exacly/state/main.json ]; then cp spec/exacly/state/main.json reports/state/main.json; fi
uv run --locked exacly-refresh spec/exacly/*.yaml --context main --state reports/state/main.json \
  --junit reports/junit.xml --distribution --job-status success --revision "$revision"
uv run --locked exacly-validate spec/exacly/*.yaml reports/state/main.json --revision "$revision"
"""

[tasks.check]
description = "Everything CI runs"
depends = ["model"]
